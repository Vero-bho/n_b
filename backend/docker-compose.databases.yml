services:
  postgres:
    image: postgres:16-alpine
    container_name: noir-bijoux-postgres
    environment:
      POSTGRES_DB: noir_bijoux
      POSTGRES_USER: noir
      POSTGRES_PASSWORD: noir
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql-postgres:/scripts:ro
      # при первом запуске контейнер сам выполняет этот файл:
      - ./sql-postgres/00_create_all_simple.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noir -d noir_bijoux"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── Microsoft SQL Server (альтернатива, папка sql/) ───────────────────────
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: noir-bijoux-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./sql:/scripts:ro     # скрипты создания базы доступны внутри контейнера
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mssql-data:
  postgres-data:
